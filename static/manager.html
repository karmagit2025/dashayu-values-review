<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>价值观考核 · 待我评价</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  body { padding-bottom: 24px; }
  .stats { display: flex; gap: 10px; margin: 14px 0 4px; }
  .stat { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; color: var(--navy); line-height: 1.2; }
  .stat span { font-size: 12.5px; color: #6b7280; }
  .person { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line);
            border-radius: 12px; padding: 14px; margin: 10px 0; }
  .person .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8edf7; color: #1f3864;
                    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .person .info { flex: 1; min-width: 0; }
  .person .nm { font-size: 15.5px; font-weight: 600; color: #1f2430; }
  .person .meta { font-size: 12.5px; color: #6b7280; margin-top: 2px; }
  .person .btn { padding: 8px 14px; font-size: 14px; }
  .section-title { font-size: 13px; color: #6b7280; margin: 22px 0 6px; font-weight: 600; letter-spacing: .5px; }
  .empty { background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 30px 16px;
           text-align: center; color: #9aa2b1; font-size: 13.5px; }
  .done .person { opacity: .72; }
  .topbar .refresh { position: absolute; right: 16px; top: 18px; }
</style>
</head>
<body>
<div id="root"><div class="center">加载中…</div></div>
<script>
const TOKEN = location.pathname.split('/').pop();
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(t) { return t ? String(t).slice(5, 16) : ''; }

function personRow(it, done) {
  const initial = (it.emp || '?').slice(0, 1);
  const meta = done
    ? `${esc(it.dept)} · 已完成 ${esc(fmt(it.mgr_at))}`
    : `${esc(it.dept)} · 自评提交 ${esc(fmt(it.emp_at))}`;
  return `<div class="person">
    <div class="avatar">${esc(initial)}</div>
    <div class="info"><div class="nm">${esc(it.emp)}</div><div class="meta">${meta}</div></div>
    <a class="btn ${done ? 'ghost' : 'primary'}" href="${esc(it.link)}">${done ? '查看' : '去评价'}</a>
  </div>`;
}

function render(d) {
  const todo = d.todo || [], done = d.done || [];
  document.getElementById('root').innerHTML = `
  <div class="topbar" style="position:relative"><div class="wrap">
    <div class="company">泉州市大鲨鱼机械科技有限公司</div>
    <h1>价值观考核 · 待我评价</h1>
    <div class="meta"><span>主管 <b>${esc(d.manager.name)}</b></span>
      <span class="badge">负责人 ${todo.length + done.length} 人</span></div>
  </div></div>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><b>${todo.length}</b><span>待我评价</span></div>
      <div class="stat"><b>${d.pending_self || 0}</b><span>员工填写中</span></div>
      <div class="stat"><b>${done.length}</b><span>我已完成</span></div>
    </div>
    <div class="section-title">待评价</div>
    ${todo.length ? todo.map(i => personRow(i, false)).join('')
      : '<div class="empty">现在没有待评价的人<br><span style="font-size:12.5px">员工提交自评后会出现在这里</span></div>'}
    ${done.length ? `<div class="section-title">已完成</div><div class="done">${done.map(i => personRow(i, true)).join('')}</div>` : ''}
    <p style="text-align:center;font-size:12px;color:#9aa2b1;margin-top:18px">
      看不到某个人？可能是他的部门还没挂到你名下，联系 HR 调整。
    </p>
  </div>`;
}

async function load() {
  try {
    const r = await fetch(`/api/manager/${TOKEN}`);
    const j = await r.json();
    if (!r.ok) {
      document.getElementById('root').innerHTML =
        `<div class="center"><h2 style="color:#c0392b">${esc(j.detail || '链接无效')}</h2>
         <p>请找 HR 要一条新的主管链接。</p></div>`;
      return;
    }
    render(j);
  } catch (e) {
    document.getElementById('root').innerHTML = '<div class="center">网络错误，请刷新重试</div>';
  }
}
load();
</script>
</body>
</html>
